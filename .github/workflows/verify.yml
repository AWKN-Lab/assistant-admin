name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run check:classes
      - run: npm test
      - run: npm run test:policy
      - run: npm run build
      - run: npm run check:no-external
      # 中文字形自检：截图里的中文必须是真字形，不能是 .notdef 豆腐块。
      # 浏览器由 playwright 装；check-glyphs.mjs 会自己在 ms-playwright 缓存里找（版本无关）。
      - name: Install chromium (glyph self-check)
        run: npx --yes playwright install --with-deps chromium
      - run: npm run check:glyphs
      # 清单守卫必须验**提交进仓的那份**，而不是"先重算再验"（自我一致 ⇒ 错的清单也不会红）
      - name: Verify committed MANIFEST (fail closed)
        run: npm run verify:manifest
      - name: MANIFEST must be up to date with the working tree
        run: |
          npm run manifest
          if ! git diff --exit-code -- MANIFEST.sha256; then
            echo "::error::MANIFEST.sha256 与工作区不一致（提交前请重算并提交）"
            git diff -- MANIFEST.sha256 | head -40
            exit 1
          fi
