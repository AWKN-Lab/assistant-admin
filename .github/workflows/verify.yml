name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run check:classes
      - run: npm test
      - run: npm run test:policy
      - run: npm run build
      - run: npm run check:no-external
      - run: npm run manifest
      - run: npm run verify:manifest
