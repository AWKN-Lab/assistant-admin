name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run check:classes
      - run: npm test
      - run: npm run test:policy
      - run: npm run build
      - run: npm run check:no-external
      # 中文字形自检：截图里的中文必须是真字形，不能是 .notdef 豆腐块。
      # 浏览器由 playwright 装；check-glyphs.mjs 会自己在 ms-playwright 缓存里找（版本无关）。
      - name: Install chromium (glyph self-check)
        run: npx --yes playwright install --with-deps chromium
      - run: npm run check:glyphs
      - run: npm run manifest
      - run: npm run verify:manifest
